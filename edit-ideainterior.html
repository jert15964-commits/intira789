<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไข ideainterior - อินทิรา 789 กรุ๊ป</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ... (โค้ด CSS ของคุณคงเดิม) ... */
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        /* Navbar */
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #ff8800;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-size: 18px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a.active,
        .nav-links a:hover {
            color: #F7931E;
            text-decoration: underline;
        }

        /* ฟอร์มและช่องกรอกข้อมูลหลัก */
        .form-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .input-field-full {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            background-color: #fffdd0;
            outline: none;
            margin-bottom: 20px;
        }

        /* ส่วนจัดวาง ลิงก์รูปภาพ กับ กล่องพรีวิว */
        .image-section {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            align-items: flex-start;
        }

        .links-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-field-link {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            background-color: #fffdd0;
            outline: none;
        }

        .previews-group {
            flex: 2;
            display: flex;
            gap: 20px;
        }

        .image-preview-box {
            flex: 1;
            height: 180px;
            background-color: #fffdd0;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            overflow: hidden;
            text-align: center;
            padding: 5px;
        }

        .image-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        /* ปุ่มสีส้ม */
        .btn-orange {
            background-color: #ff944d;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            padding: 12px 80px;
            cursor: pointer;
            display: block;
            margin: 0 auto 40px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-orange:hover {
            background-color: #ff8033;
        }

        /* -------------------------------------------
           รายการแสดงผลการ์ดด้านล่าง (กรอบดำ)
        ------------------------------------------- */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .item-card {
            display: flex;
            align-items: center;
            border: 2px solid #000;
            background-color: #fff;
            padding: 8px 20px;
        }

        .item-id {
            font-size: 36px;
            font-weight: bold;
            min-width: 90px;
            text-align: center;
            border-right: 2px solid #000;
            padding-right: 15px;
            margin-right: 20px;
        }

        .item-name {
            flex-grow: 1;
            font-size: 22px;
            font-weight: 500;
            color: #000;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-card-action {
            background-color: #ff944d;
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 5px 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            min-width: 90px;
            text-align: center;
        }

        .btn-card-action:hover {
            background-color: #ff8033;
        }

        /* -------------------------------------------
           หน้าต่าง Pop-up Modal สำหรับแก้ไขข้อมูล
        ------------------------------------------- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90%;
            max-width: 850px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .image-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .preview-box-modal {
            width: 100%;
            height: 150px;
            background-color: #fffdd0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }

        .preview-box-modal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-red-delete {
            background-color: #ff3b30;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 6px 35px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-red-delete:hover {
            background-color: #e02d22;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn-cancel-modal {
            background-color: #b0bec5;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 12px 45px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel-modal:hover {
            background-color: #90a4ae;
        }

        .btn-confirm-modal {
            background-color: #ff944d;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 12px 55px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-confirm-modal:hover {
            background-color: #ff8033;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1 class="logo">แก้ไขideainterior</h1>
        <div class="nav-links">
            <a href="edit-main.html">หน้าหลัก</a>
            <a href="edit-about_us.html">เกี่ยวกับเรา</a>
            <a href="edit-ideainterior.html" class="active">ไอเดีย</a>
            <a href="edit-example.html">ตัวอย่าง</a>
            <a href="edit-contact.html">ติดต่อ</a>
            <a href="../fontend/index.html">กลับสู่หน้าหลัก</a>
        </div>
    </div>

    <div class="form-container">
        <!-- ฟอร์มสำหรับเพิ่มข้อมูลใหม่ -->
        <form id="ideaForm">
            <input type="text" id="id_ii" class="input-field-full" placeholder="รหัส" required>
            <input type="text" id="name_ii" class="input-field-full" placeholder="ชื่อ">
            <input type="text" id="type_ii" class="input-field-full" placeholder="ประเภท">

            <div class="image-section">
                <div class="links-group">
                    <input type="text" id="image1_ii" class="input-field-link" placeholder="ลิงค์รูป1" oninput="previewImages()">
                    <input type="text" id="image2_ii" class="input-field-link" placeholder="ลิงค์รูป2" oninput="previewImages()">
                    <input type="text" id="image3_ii" class="input-field-link" placeholder="ลิงค์รูป3" oninput="previewImages()">
                </div>

                <div class="previews-group">
                    <div class="image-preview-box" id="preview1">รูป1</div>
                    <div class="image-preview-box" id="preview2">รูป2</div>
                    <div class="image-preview-box" id="preview3">รูป3</div>
                </div>
            </div>

            <button type="submit" class="btn-orange">ตกลง</button>
        </form>

        <!-- รายการแสดงผลการ์ดด้านล่าง -->
        <div class="gallery-container" id="galleryContainer"></div>
    </div>

    <!-- หน้าต่าง Pop-up สำหรับแก้ไขข้อมูล -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <input type="text" id="edit_id_ii" class="input-field-full" placeholder="รหัส" readonly>
            <input type="text" id="edit_name_ii" class="input-field-full" placeholder="ชื่อ">
            <input type="text" id="edit_type_ii" class="input-field-full" placeholder="ประเภท">

            <div class="images-grid">
                <div class="image-column">
                    <div class="preview-box-modal" id="modal_preview1">รูป1</div>
                    <button type="button" class="btn-red-delete" onclick="clearModalImg(1)">ลบ</button>
                    <input type="text" id="edit_image1_ii" class="input-field-link" placeholder="ลิงค์รูป1" oninput="updateModalPreview(1)">
                </div>

                <div class="image-column">
                    <div class="preview-box-modal" id="modal_preview2">รูป2</div>
                    <button type="button" class="btn-red-delete" onclick="clearModalImg(2)">ลบ</button>
                    <input type="text" id="edit_image2_ii" class="input-field-link" placeholder="ลิงค์รูป2" oninput="updateModalPreview(2)">
                </div>

                <div class="image-column">
                    <div class="preview-box-modal" id="modal_preview3">รูป3</div>
                    <button type="button" class="btn-red-delete" onclick="clearModalImg(3)">ลบ</button>
                    <input type="text" id="edit_image3_ii" class="input-field-link" placeholder="ลิงค์รูป3" oninput="updateModalPreview(3)">
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel-modal" onclick="closeEditModal()">ยกเลิก</button>
                <button type="button" class="btn-confirm-modal" onclick="saveEditData()">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/ideaint';
        let allIdeasData = []; // สำหรับเก็บรายการข้อมูลที่ดึงมาจาก API

        document.addEventListener('DOMContentLoaded', loadData);

        // แปลงลิงค์ Google Drive เป็น Direct View URL
        function convertDriveUrl(url) {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)|id=([a-zA-Z0-9_-]+)/);
            if (match) {
                const fileId = match[1] || match[2];
                return `https://lh3.googleusercontent.com/d/${fileId}`;
            }
            return url;
        }

        // ฟังก์ชันพรีวิวภาพฟอร์มสร้างใหม่
        function previewImages() {
            updatePreview('image1_ii', 'preview1', 'รูป1');
            updatePreview('image2_ii', 'preview2', 'รูป2');
            updatePreview('image3_ii', 'preview3', 'รูป3');
        }

        function updatePreview(inputId, previewBoxId, defaultText) {
            const rawUrl = document.getElementById(inputId).value.trim();
            const previewBox = document.getElementById(previewBoxId);

            if (rawUrl) {
                const imageUrl = convertDriveUrl(rawUrl);
                previewBox.innerHTML = `<img src="${imageUrl}" onerror="this.onerror=null; this.parentElement.innerText='รูปไม่ถูกต้อง';">`;
            } else {
                previewBox.innerHTML = defaultText;
            }
        }

        // ดึงข้อมูลไอเดียทั้งหมดมาแสดง
        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/all`);
                const result = await res.json();

                if (result.success) {
                    allIdeasData = result.data || [];
                    renderList(allIdeasData);
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // วาดการ์ดแสดงผลด้านล่าง (กรอบดำ)
        function renderList(data) {
            const gallery = document.getElementById('galleryContainer');
            gallery.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                card.innerHTML = `
                    <div class="item-id">${item.id_ii}</div>
                    <div class="item-name">${item.name_ii || 'ไม่ระบุชื่อ'}</div>
                    <div class="item-actions">
                        <button type="button" class="btn-card-action" onclick="openEditModal(${item.id_ii})">แก้ไข</button>
                        <button type="button" class="btn-card-action" onclick="deleteItem(${item.id_ii})">ลบ</button>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // เพิ่มข้อมูลใหม่
        document.getElementById('ideaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                id_ii: parseInt(document.getElementById('id_ii').value),
                name_ii: document.getElementById('name_ii').value.trim(),
                type_ii: document.getElementById('type_ii').value.trim(),
                image1_ii: convertDriveUrl(document.getElementById('image1_ii').value.trim()),
                image2_ii: convertDriveUrl(document.getElementById('image2_ii').value.trim()),
                image3_ii: convertDriveUrl(document.getElementById('image3_ii').value.trim())
            };

            try {
                const res = await fetch(`${API_URL}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (result.success) {
                    alert('บันทึกข้อมูลเรียบร้อยแล้ว');
                    document.getElementById('ideaForm').reset();
                    previewImages();
                    loadData();
                } else {
                    alert('เกิดข้อผิดพลาด: ' + result.message);
                }
            } catch (error) {
                console.error('Error adding data:', error);
            }
        });

        // เปิด Modal แก้ไขและเติมข้อมูลลงในช่อง
        function openEditModal(id) {
            const item = allIdeasData.find(d => d.id_ii === id);
            if (!item) return;

            document.getElementById('edit_id_ii').value = item.id_ii;
            document.getElementById('edit_name_ii').value = item.name_ii || '';
            document.getElementById('edit_type_ii').value = item.type_ii || '';
            document.getElementById('edit_image1_ii').value = item.image1_ii || '';
            document.getElementById('edit_image2_ii').value = item.image2_ii || '';
            document.getElementById('edit_image3_ii').value = item.image3_ii || '';

            updateModalPreview(1);
            updateModalPreview(2);
            updateModalPreview(3);

            document.getElementById('editModal').style.display = 'flex';
        }

        // ปิด Modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // อัปเดตพรีวิวรูปภาพใน Modal
        function updateModalPreview(num) {
            const url = document.getElementById(`edit_image${num}_ii`).value.trim();
            const box = document.getElementById(`modal_preview${num}`);

            if (url) {
                const imageUrl = convertDriveUrl(url);
                box.innerHTML = `<img src="${imageUrl}" onerror="this.parentElement.innerText='รูป${num}';">`;
            } else {
                box.innerHTML = `รูป${num}`;
            }
        }

        // ล้างรูปใน Modal
        function clearModalImg(num) {
            document.getElementById(`edit_image${num}_ii`).value = '';
            updateModalPreview(num);
        }

        // บันทึกการแก้ไข (PUT)
        async function saveEditData() {
            const id = document.getElementById('edit_id_ii').value;
            const payload = {
                name_ii: document.getElementById('edit_name_ii').value.trim(),
                type_ii: document.getElementById('edit_type_ii').value.trim(),
                image1_ii: convertDriveUrl(document.getElementById('edit_image1_ii').value.trim()),
                image2_ii: convertDriveUrl(document.getElementById('edit_image2_ii').value.trim()),
                image3_ii: convertDriveUrl(document.getElementById('edit_image3_ii').value.trim())
            };

            try {
                const res = await fetch(`${API_URL}/update/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (result.success) {
                    alert('แก้ไขข้อมูลเรียบร้อยแล้ว');
                    closeEditModal();
                    loadData();
                } else {
                    alert('เกิดข้อผิดพลาด: ' + (result.message || 'ไม่สามารถแก้ไขได้'));
                }
            } catch (error) {
                console.error('Error updating data:', error);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ Server');
            }
        }

        // ลบข้อมูลไอเดีย
        async function deleteItem(id_ii) {
            if (!confirm(`คุณต้องการลบข้อมูลไอเดียรหัส ${id_ii} ใช่หรือไม่?`)) return;

            try {
                const res = await fetch(`${API_URL}/delete/${id_ii}`, {
                    method: 'DELETE'
                });

                const result = await res.json();
                if (result.success) {
                    alert('ลบข้อมูลสำเร็จ');
                    loadData();
                } else {
                    alert('ไม่สามารถลบได้: ' + result.message);
                }
            } catch (error) {
                console.error('Error deleting data:', error);
            }
        }
    </script>
</body>
</html>
